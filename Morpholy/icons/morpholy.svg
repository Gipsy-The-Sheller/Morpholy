<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Morpholy icon: stylized landmark points connected by lines -->
  <rect width="64" height="64" rx="8" fill="#2b2b3b"/>
  <!-- Connecting lines between landmarks -->
  <line x1="16" y1="16" x2="48" y2="20" stroke="#5599ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="48" y1="20" x2="50" y2="48" stroke="#5599ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="48" x2="20" y2="50" stroke="#5599ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="20" y1="50" x2="16" y2="16" stroke="#5599ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="16" y1="16" x2="50" y2="48" stroke="#5599ff" stroke-width="1" opacity="0.4"/>
  <line x1="48" y1="20" x2="20" y2="50" stroke="#5599ff" stroke-width="1" opacity="0.4"/>
  <!-- Landmark points -->
  <circle cx="16" cy="16" r="4" fill="#ff4444"/>
  <circle cx="48" cy="20" r="4" fill="#ff4444"/>
  <circle cx="50" cy="48" r="4" fill="#ff4444"/>
  <circle cx="20" cy="50" r="4" fill="#ff4444"/>
  <!-- Center cross -->
  <circle cx="32" cy="32" r="3" fill="#ffaa00"/>
</svg>
